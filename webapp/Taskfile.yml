version: '3'

vars:
  ALP_VERSION: '1.0.21'

tasks:
  install:
    desc: Install ISUCON profiling tools
    cmds:
      - |
        curl -fL \
          "https://github.com/tkuchiki/alp/releases/download/v{{.ALP_VERSION}}/alp_linux_amd64.tar.gz" \
          -o /tmp/alp.tar.gz
        tar -xzf /tmp/alp.tar.gz -C /tmp
        sudo install -m 0755 /tmp/alp /usr/local/bin/alp
        rm -f /tmp/alp.tar.gz /tmp/alp

      - sudo apt-get update
      - sudo apt-get install -y percona-toolkit

  check:
    desc: Check installed profiling tools
    cmds:
      - alp --version
      - pt-query-digest --version
      - jq --version

